<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>ZenkaiOS</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/details.css') }}">

</head>

<body>

<!-- Hero Banner -->

<button id="backButton">

    <i class="fa-solid fa-arrow-left"></i>

</button>

<button id="shareButton">

    <i class="fa-solid fa-share-nodes"></i>

</button>

<section id="heroBanner">

    <img id="bannerImage">

    <div id="bannerGradient"></div>

</section>

<!-- Floating Poster -->

<section id="posterSection">

    <div id="posterWrapper">

        <img id="posterImage">

    </div>

    <div id="titleSection">

        <h1 id="animeTitle"></h1>

        <h3 id="animeJapanese"></h3>

        <div id="animeMeta"></div>

    </div>

</section>

<!-- Buttons -->

<section id="actionButtons">

<button id="watchNow">

<i class="fa-solid fa-play"></i>

Watch Now

</button>

<button id="myList">

    <i class="fa-solid fa-plus"></i>

</button>

</section>

<!-- Genres -->

<section id="genreSection">

</section>

<!-- Synopsis -->

<section id="synopsisSection">

<h2>Synopsis</h2>

<p id="synopsisText"></p>

<button id="readMore">

Read More

</button>

</section>

<!-- Information -->

<!-- Information -->

<section id="infoSection">

    <h2>Anime Information</h2>

    <div id="infoGrid">

        <div class="infoCard">

            <span class="infoLabel">⭐ Score</span>

            <span id="infoScore" class="infoValue">-</span>

        </div>

        <div class="infoCard">

            <span class="infoLabel">📺 Episodes</span>

            <span id="infoEpisodes" class="infoValue">-</span>

        </div>

        <div class="infoCard">

            <span class="infoLabel">🎬 Studio</span>

            <span id="infoStudio" class="infoValue">-</span>

        </div>

        <div class="infoCard">

            <span class="infoLabel">📖 Source</span>

            <span id="infoSource" class="infoValue">-</span>

        </div>

        <div class="infoCard">

            <span class="infoLabel">📅 Season</span>

            <span id="infoSeason" class="infoValue">-</span>

        </div>

        <div class="infoCard">

            <span class="infoLabel">🏷 Status</span>

            <span id="infoStatus" class="infoValue">-</span>

        </div>

        <div class="infoCard">

            <span class="infoLabel">🎞 Format</span>

            <span id="infoFormat" class="infoValue">-</span>

        </div>

        <div class="infoCard">

            <span class="infoLabel">⏱ Duration</span>

            <span id="infoDuration" class="infoValue">-</span>

        </div>

    </div>

</section>

<!-- Trailer -->

<section id="trailerSection">

    <h2>Official Trailer</h2>

    <div id="trailerCard">

        <div id="trailerThumbnail">

            <img id="trailerImage">

            <div id="playOverlay">

                <i class="fa-solid fa-play"></i>

            </div>

        </div>

        <div id="trailerInfo">

            <h3 id="trailerTitle">

                Watch Official Trailer

            </h3>

            <p id="trailerSubtitle">

                Stream on YouTube

            </p>

        </div>

    </div>

</section>

<!-- Characters -->

<section id="characterSection">

</section>

<!-- Related -->

<section id="relatedSection">

</section>

<!-- Recommendation -->

<section id="recommendationSection">

</section>

<script
src="{{ url_for('static', filename='js/details.js') }}">
</script>

</body>

</html>
