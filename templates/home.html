<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1">

<title>ZenkaiOS</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/home.css') }}">
</head>

<body>

<header id="topHeader">

<div class="header-left">

<button id="menuBtn" class="circle-btn">
<i class="fa-solid fa-bars"></i>
</button>

<div class="brand">

<h1>Zenkai<span>OS</span></h1>

<p>ゼンカイOS</p>

</div>

</div>

<div class="header-right">

<button id="searchBtn" class="circle-btn">
<i class="fa-solid fa-search"></i>
</button>

<button id="notificationBtn" class="circle-btn">
<i class="fa-regular fa-bell"></i>
</button>

<img
id="profileAvatar"
src="https://i.pravatar.cc/100"
alt="Profile">

</div>

</header>

<main id="homePage">

<section id="heroBanner">

<div id="heroSlider"></div>

<div id="heroIndicators"></div>

<div id="heroProgress">

<div id="heroProgressFill"></div>

</div>

</section>

<section id="topPickSection">

<h2 class="block-title">

<i class="fa-solid fa-crown"></i>

Top Picks Today

</h2>

<div id="topPickCard"></div>

</section>

<section id="homeSections">

</section>

</main>

<nav id="bottomNav"></nav>

<script src="{{ url_for('static', filename='js/home.js') }}"></script>

</body>
</html>
