<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ZenkaiOS</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/home.css') }}">

</head>

<body>

<!-- ===========================
HEADER
=========================== -->

<header id="header">

<div class="header-left">

<button id="menuBtn">
<i class="fa-solid fa-bars"></i>
</button>

<div class="brand">

<h1>Zenkai<span>OS</span></h1>

<p>Anime Streaming</p>

</div>

</div>

<div class="header-right">

<button id="searchBtn">
<i class="fa-solid fa-magnifying-glass"></i>
</button>

<button id="notificationBtn">
<i class="fa-regular fa-bell"></i>
</button>

<img
id="profileAvatar"
src="https://i.pravatar.cc/120"
alt="Profile">

</div>

</header>

<!-- ===========================
MAIN
=========================== -->

<main id="main">

<!-- HERO -->

<section id="heroSection">

<div id="heroSlider"></div>

<div id="heroIndicators"></div>

<div id="heroProgress">

<div id="heroProgressFill"></div>

</div>

</section>

<!-- TOP PICK -->

<section id="topPickSection">

<h2 class="section-title">

<i class="fa-solid fa-crown"></i>

Top Pick

</h2>

<div id="topPickCard"></div>

</section>

<!-- HOME ROWS -->

<div id="homeSections">

</div>

</main>

<!-- ===========================
BOTTOM NAVIGATION
=========================== -->

<nav id="bottomNav">

<button class="navItem active">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</button>

<button class="navItem">

<i class="fa-solid fa-tv"></i>

<span>Anime</span>

</button>

<button class="navItem">

<i class="fa-solid fa-magnifying-glass"></i>

<span>Search</span>

</button>

<button class="navItem">

<i class="fa-solid fa-bookmark"></i>

<span>Library</span>

</button>

<button class="navItem profile-nav">

<img
class="nav-avatar"
src="https://i.pravatar.cc/120">

<span>Me</span>

</button>

</nav>

<script
src="{{ url_for('static', filename='js/home.js') }}">
</script>

</body>

</html>
