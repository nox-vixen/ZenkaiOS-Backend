<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ZenkaiOS</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/home.css') }}">

</head>

<body>

<!-- ===========================
HEADER
=========================== -->

<header id="header">

<div class="header-left">

<button id="menuBtn">
<i class="fa-solid fa-bars"></i>
</button>

<div class="brand">

<h1>Zenkai<span>OS</span></h1>

<p>Anime Streaming</p>

</div>

</div>

<div class="header-right">

<button id="searchBtn">
<i class="fa-solid fa-magnifying-glass"></i>
</button>

<button id="notificationBtn">
<i class="fa-regular fa-bell"></i>
</button>

<img
id="profileAvatar"
src="https://i.pravatar.cc/120"
alt="Profile">

</div>

</header>

<!-- ===========================
MAIN
=========================== -->

<main id="main">

<!-- HERO -->

<section id="heroSection">

<div class="hero-frame">

<div id="heroBorderRunner"></div>

<div id="heroSlider"></div>

<div class="hero-bottom">

<div id="heroIndicators"></div>

</div>

</div>

</section>

<!-- TOP PICK -->

<section id="topPickSection">

<h2 class="section-title">

<i class="fa-solid fa-crown"></i>

Top Pick

</h2>

<div id="topPickCard"></div>

</section>

<!-- HOME ROWS -->

<div id="homeSections">

</div>

</main>

<!-- ===========================
BOTTOM NAVIGATION
=========================== -->

<div class="bottom-dock">

    <div class="dock-item active" data-page="home">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </div>

    <div class="dock-item" data-page="anime">
        <i class="fa-solid fa-tv"></i>
        <span>Anime</span>
    </div>

    <div class="dock-center">
        <i class="fa-solid fa-play"></i>
    </div>

    <div class="dock-item" data-page="library">
        <i class="fa-solid fa-bookmark"></i>
        <span>Library</span>
    </div>

    <div class="dock-item" data-page="profile">
        <i class="fa-solid fa-user"></i>
        <span>Me</span>
    </div>

</div>

<script src="{{ url_for('static', filename='js/home.js') }}">
</script>

</body>

</html>
