<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Search • ZenkaiOS</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/search.css') }}">

</head>

<body>

<!-- Floating Header -->

<header id="searchHeader">

<button id="backBtn">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div id="searchBar">

<i class="fa-solid fa-magnifying-glass"></i>

<input
id="searchInput"
type="text"
placeholder="Search anime...">

<button id="clearSearch">

<i class="fa-solid fa-xmark"></i>

</button>

</div>

<button id="voiceBtn">

<i class="fa-solid fa-microphone"></i>

</button>

</header>

<main id="searchMain">

<section id="recentSection">

<h2>Recent Searches</h2>

<div id="recentList"></div>

</section>

<section id="trendingSection">

<h2>Trending</h2>

<div id="trendingList"></div>

</section>

<section id="genreSection">

<h2>Genres</h2>

<div id="genreChips"></div>

</section>

<section id="resultSection">

<div id="resultGrid"></div>

</section>

</main>

<div id="filterSheet"></div>

<div id="voiceSheet"></div>

<script
src="{{ url_for('static', filename='js/search.js') }}">
</script>

</body>

</html>
