<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Search • ZenkaiOS</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/search.css') }}">

</head>

<body>

<!-- Floating Header -->

<header id="searchHeader">

<button id="backBtn">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div id="searchBar">

<i class="fa-solid fa-magnifying-glass"></i>

<input
id="searchInput"
type="text"
placeholder="Search anime...">

<button id="clearSearch">

<i class="fa-solid fa-xmark"></i>

</button>

</div>

<button id="voiceBtn">

<i class="fa-solid fa-microphone"></i>

</button>

</header>

<main id="searchMain">

<section id="recentSection">

<div class="section-title">

<h2>Recent Searches</h2>

<button id="clearHistory">

<i class="fa-solid fa-trash"></i>

</button>

</div>

<div id="recentList"></div>

</section>

<section id="trendingSection">

<h2>
<i class="fa-solid fa-fire"
style="color:#a855f7;margin-right:8px;"></i>
Trending
</h2>

<div id="trendingList"></div>

</section>

<section id="genreSection">

<h2>Genres</h2>

<div id="genreChips"></div>

</section>

<section id="resultSection">

<div id="resultGrid"></div>

</section>

</main>

<div id="filterSheet"></div>

<div id="voiceSheet">

<div class="voice-content">

<div class="voice-ring">

<div class="voice-core">

<i class="fa-solid fa-microphone"></i>

</div>

</div>

<h2 id="voiceStatus">

Listening...

</h2>

<p id="voiceResult">

Speak the anime name

</p>

<button id="cancelVoice">

Cancel

</button>

</div>

</div>

<div id="confirmPopup">

<div class="confirm-card">

<h3 id="confirmTitle">

Delete?

</h3>

<p id="confirmText">

Are you sure?

</p>

<div class="confirm-buttons">

<button id="confirmCancel">

Cancel

</button>

<button id="confirmYes">

Yes

</button>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='js/search.js') }}">
</script>

</body>

</html>
